name: Release theme

# Fires on any dotted X.Y.Z-shaped tag; the in-job bare-semver regex is the real
# gate (it MUST equal manifest.json's version — the community picker's hard
# requirement). A prerelease/typo tag runs, fails the check, cuts no release.

on:
  push:
    tags:
      - '*.*.*'

permissions:
  contents: write   # gh release create — nothing more (no OIDC on this path)

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches manifest version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! [[ "$REF_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$REF_NAME' is not a bare semver X.Y.Z."
            exit 1
          fi
          manifest_version=$(jq -r .version manifest.json)
          if ! [[ "$manifest_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::manifest.json version '$manifest_version' is not a bare semver."
            exit 1
          fi
          if [ "$REF_NAME" != "$manifest_version" ]; then
            echo "::error::Tag is $REF_NAME but manifest.json has version $manifest_version."
            exit 1
          fi
          echo "VERSION=$manifest_version" >> "$GITHUB_ENV"

      - name: Create release with theme assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          sha=$(sha256sum theme.css | cut -d' ' -f1)
          {
            echo "Artificer theme for Obsidian, version ${VERSION}."
            echo
            echo "**Install via BRAT:** add the beta theme \`cameronsjo/artificer-obsidian\`, or download"
            echo "\`theme.css\` + \`manifest.json\` into \`<vault>/.obsidian/themes/Artificer/\`."
            echo
            echo "Release assets are mutable and carry no build provenance; verify integrity:"
            echo
            echo "\`\`\`"
            echo "theme.css  sha256  ${sha}"
            echo "\`\`\`"
          } > release-notes.md
          gh release create "$REF_NAME" \
            --title "$VERSION" \
            --notes-file release-notes.md \
            manifest.json \
            theme.css
